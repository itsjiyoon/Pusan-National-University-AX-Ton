<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전셈 | 계약서·등기부등본 분석하기</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .analyze-sec {
            padding: 50px 0 80px;
            display: flex;
            justify-content: center;
        }

        .analyze-card-wrapper {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: var(--radius-lg, 28px);
            padding: 48px 40px;
            box-shadow: var(--shadow-pop, 0 16px 40px rgba(36, 59, 100, 0.18));
            border: 1px solid var(--gray-100, #F1F3F7);
            box-sizing: border-box;
        }

        .analyze-title-area h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.35;
            margin: 8px 0 10px;
            letter-spacing: -0.4px;
            color: var(--ink, #1C263A);
        }

        .upload-group {
            margin-bottom: 24px;
        }

        .upload-label {
            display: block;
            font-size: 17px;
            font-weight: 800;
            color: var(--ink, #1C263A);
            margin-bottom: 12px;
        }

        .drop-zone {
            position: relative;
            border: 2px dashed var(--gray-300, #D7DEE8);
            border-radius: var(--radius-md, 18px);
            padding: 36px 20px;
            text-align: center;
            background: var(--blue-50, #F4F6FA);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-sizing: border-box;
        }

        .drop-zone:hover {
            border-color: var(--blue, #243B64);
            background: #EBF1F9;
        }

        .drop-zone.uploaded {
            border: 2px solid #243B64;
            background-color: #E6ECF5;
        }

        .drop-icon {
            width: 32px;
            height: 32px;
            opacity: 0.6;
        }

        .success-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            display: none;
        }

        .drop-text {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--gray-700, #4B5566);
            word-break: break-all;
            padding: 0 10px;
        }

        .drop-zone.uploaded .drop-text {
            font-size: 15.5px;
            font-weight: 800;
            color: #1C263A;
        }

        /* 파일 삭제용 우측 상단 X 버튼 */
        .btn-delete-zone {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            width: 30px;
            height: 30px;
            background: #243B64;
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: bold;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.15s ease;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
            line-height: 1;
            padding: 0;
        }

        .drop-zone.uploaded .btn-delete-zone {
            display: flex;
        }

        .btn-delete-zone:hover {
            background: #E11D48;
            transform: scale(1.1);
        }

        /* 배경 없는 깔끔한 보안 안내 텍스트 */
        .security-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--gray-500, #7C879A);
            margin-top: 24px;
            margin-bottom: 16px;
            word-break: keep-all;
            text-align: center;
        }

        .btn-analyze {
            width: 100%;
            background: var(--gray-300, #D7DEE8);
            color: var(--gray-500, #7C879A);
            font-weight: 800;
            font-size: 18px;
            padding: 18px;
            border-radius: 16px;
            border: none;
            cursor: not-allowed;
            margin-bottom: 20px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .btn-analyze.active {
            background: var(--navy, #243B64);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(36, 59, 100, 0.2);
        }

        .btn-back-home {
            display: block;
            text-align: center;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--gray-500, #7C879A);
            text-decoration: underline;
            transition: color 0.15s;
        }

        .btn-back-home:hover {
            color: var(--blue, #243B64);
        }

        @media (max-width: 620px) {
            .analyze-card-wrapper {
                padding: 32px 24px;
            }

            .analyze-title-area h1 {
                font-size: 22px;
            }

            .security-notice {
                font-size: 12.5px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="wrap nav">
            <a href="../index.html" class="logo">
                <img src="../images/logo.png" width="40" alt="전셈 로고">
                전셈
            </a>
            <nav class="nav-menu">
                <a href="../index.html#services">서비스 소개</a>
                <a href="../index.html#diagnosis-section">안전진단</a>
                <a href="chat.html">AI 챗봇</a>
                <a href="../index.html#footer">고객지원</a>
            </nav>
        </div>
    </header>

    <section class="analyze-sec">
        <div class="wrap" style="display:flex; justify-content:center;">
            <div class="analyze-card-wrapper">

                <div class="analyze-title-area">
                    <span class="hero-eyebrow" style="margin-bottom:8px;">STEP 02</span>
                    <h1>계약서·등기부등본 분석하기</h1>
                </div>

                <p class="sub" style="margin-bottom:32px;">
                    등기부등본, 계약서 중 하나만 올려도 분석할 수 있어요. 둘 다 올리면 더 정확하게 확인해드려요.
                </p>

                <!-- 1. 등기부등본 업로드 -->
                <div class="upload-group">
                    <label class="upload-label">등기부등본</label>
                    <div class="drop-zone" id="zone-registry"
                        onclick="document.getElementById('file-registry').click();">

                        <!-- 우측 상단 삭제 버튼 -->
                        <button type="button" class="btn-delete-zone" id="btn-del-registry"
                            onclick="removeFile(event, 'registry')" title="파일 삭제">✕</button>

                        <input type="file" id="file-registry" style="display:none;" accept=".pdf,image/*"
                            onchange="checkFiles()">

                        <svg class="drop-icon" id="icon-registry" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                        </svg>

                        <img src="../images/complete.png" id="img-registry" class="success-img" alt="업로드 완료">
                        <span class="drop-text" id="text-registry">클릭하거나 파일을 끌어다 놓으세요 (이미지, PDF)</span>
                    </div>
                </div>

                <!-- 2. 계약서 업로드 -->
                <div class="upload-group">
                    <label class="upload-label">계약서</label>
                    <div class="drop-zone" id="zone-contract"
                        onclick="document.getElementById('file-contract').click();">

                        <!-- 우측 상단 삭제 버튼 -->
                        <button type="button" class="btn-delete-zone" id="btn-del-contract"
                            onclick="removeFile(event, 'contract')" title="파일 삭제">✕</button>

                        <input type="file" id="file-contract" style="display:none;" accept=".pdf,image/*"
                            onchange="checkFiles()">

                        <svg class="drop-icon" id="icon-contract" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                        </svg>

                        <img src="../images/complete.png" id="img-contract" class="success-img" alt="업로드 완료">
                        <span class="drop-text" id="text-contract">클릭하거나 파일을 끌어다 놓으세요 (이미지, PDF)</span>
                    </div>
                </div>

                <!-- 배경 없는 순수 텍스트 안내 -->
                <div class="security-notice">
                    🔒 업로드한 서류는 분석을 위해서만 사용되며, 안전하게 처리돼요.
                </div>

                <!-- 진단하기 버튼 -->
                <button type="button" id="btn-submit" class="btn-analyze" disabled
                    onclick="submitAnalysis()">진단하기</button>

                <a href="../index.html" class="btn-back-home">← 홈으로</a>

            </div>
        </div>
    </section>

    <script>
        function checkFiles() {
            const registry = document.getElementById('file-registry').files[0];
            const contract = document.getElementById('file-contract').files[0];
            const submitBtn = document.getElementById('btn-submit');

            if (registry) {
                document.getElementById('zone-registry').classList.add('uploaded');
                document.getElementById('icon-registry').style.display = 'none';
                document.getElementById('img-registry').style.display = 'block';
                document.getElementById('text-registry').innerText = registry.name;
            }

            if (contract) {
                document.getElementById('zone-contract').classList.add('uploaded');
                document.getElementById('icon-contract').style.display = 'none';
                document.getElementById('img-contract').style.display = 'block';
                document.getElementById('text-contract').innerText = contract.name;
            }

            updateSubmitButtonState();
        }

        // 특정 파일 삭제 처리
        function removeFile(event, type) {
            // 부모 drop-zone의 클릭 이벤트(파일 선택창 열림) 방지
            event.stopPropagation();

            const fileInput = document.getElementById(`file-${type}`);
            const zone = document.getElementById(`zone-${type}`);
            const icon = document.getElementById(`icon-${type}`);
            const img = document.getElementById(`img-${type}`);
            const text = document.getElementById(`text-${type}`);

            fileInput.value = '';
            zone.classList.remove('uploaded');
            icon.style.display = 'block';
            img.style.display = 'none';
            text.innerText = '클릭하거나 파일을 끌어다 놓으세요 (이미지, PDF)';

            updateSubmitButtonState();
        }

        // 진단하기 버튼 활성/비활성화 상태 업데이트
        function updateSubmitButtonState() {
            const registry = document.getElementById('file-registry').files[0];
            const contract = document.getElementById('file-contract').files[0];
            const submitBtn = document.getElementById('btn-submit');

            if (registry || contract) {
                submitBtn.classList.add('active');
                submitBtn.removeAttribute('disabled');
            } else {
                submitBtn.classList.remove('active');
                submitBtn.setAttribute('disabled', 'true');
            }
        }

        // 드래그 앤 드롭 지원
        ['registry', 'contract'].forEach(type => {
            const zone = document.getElementById(`zone-${type}`);
            const input = document.getElementById(`file-${type}`);

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.style.borderColor = '#243B64';
            });

            zone.addEventListener('dragleave', () => {
                if (!zone.classList.contains('uploaded')) {
                    zone.style.borderColor = '';
                }
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.style.borderColor = '';
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    input.files = e.dataTransfer.files;
                    checkFiles();
                }
            });
        });

        // 제출 시 유형 식별 후 이동
        function submitAnalysis() {
            const registry = document.getElementById('file-registry').files[0];
            const contract = document.getElementById('file-contract').files[0];

            let uploadType = '';
            if (registry && contract) {
                uploadType = 'both';
            } else if (registry) {
                uploadType = 'registry_only';
            } else if (contract) {
                uploadType = 'contract_only';
            }

            sessionStorage.setItem('uploadType', uploadType);
            location.href = 'result.html';
        }
    </script>
</body>

</html>
