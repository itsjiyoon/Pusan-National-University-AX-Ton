<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전셈 | AI 안심 상담</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* 화면 전체 가로 스크롤 방지 */
        html,
        body {
            overflow-x: hidden !important;
            background: #F4F6FA;
            margin: 0;
            padding: 0;
        }

        .chat-sec {
            padding: 30px 16px 50px;
            display: flex;
            justify-content: center;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        /* 챗봇 전체 컨테이너 */
        .chat-container {
            width: 100% !important;
            max-width: 760px !important;
            min-width: 320px !important;
            height: 750px !important;
            max-height: 82vh !important;
            background: #FFFFFF;
            border-radius: var(--radius-lg, 28px);
            border: 1px solid var(--gray-100, #F1F3F7);
            box-shadow: var(--shadow-pop, 0 16px 40px rgba(36, 59, 100, 0.12));
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
            position: relative;
        }

        /* 상단 챗봇 컨트롤 헤더 */
        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid #F1F3F7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            flex-shrink: 0;
            z-index: 10;
        }

        .chat-header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            color: #1C263A;
            text-decoration: none;
        }

        .chat-header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 새 상담 버튼 */
        .btn-new-chat {
            background: #E8EEF8;
            color: #243B64;
            border: none;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .btn-new-chat:hover {
            background: #DCE5F5;
        }

        /* 닫기 버튼 */
        .btn-close {
            color: #7C879A;
            font-size: 20px;
            font-weight: 500;
            text-decoration: none;
            padding: 4px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .btn-close:hover {
            color: #1C263A;
        }

        /* 메시지 대화창 */
        .chat-body {
            flex: 1 1 0% !important;
            min-height: 0 !important;
            min-width: 0 !important;
            width: 100% !important;
            padding: 0 28px 24px;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            background: #FAFAFC;
            box-sizing: border-box !important;
        }

        /* 첫 화면 연녹색 그라데이션 및 마스코트 배너 */
        .welcome-hero-banner {
            width: calc(100% + 56px);
            margin: 0 -28px 12px -28px;
            padding: 36px 20px 32px;
            background: linear-gradient(180deg, #E6F7ED 0%, #FAFAFC 100%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .welcome-mascot-img {
            width: 135px;
            height: auto;
            margin-bottom: 14px;
            display: block;
        }

        .welcome-title {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.4;
            color: #1C263A;
            margin: 0;
            word-break: keep-all;
        }

        /* 메시지 컨테이너 */
        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            padding-top: 24px;
        }

        .msg-row {
            display: flex !important;
            flex-direction: column !important;
            gap: 8px;
            max-width: 85% !important;
            min-width: 0 !important;
            box-sizing: border-box !important;
        }

        .msg-row.bot {
            align-self: flex-start !important;
        }

        .msg-row.user {
            align-self: flex-end !important;
        }

        /* 말풍선 스타일 */
        .msg-bubble {
            padding: 14px 18px !important;
            border-radius: 18px !important;
            font-size: 15px !important;
            line-height: 1.6 !important;
            width: 100% !important;
            box-sizing: border-box !important;
            word-break: keep-all !important;
            overflow-wrap: break-word !important;
        }

        .msg-row.bot .msg-bubble {
            background: #EDF2F8 !important;
            color: #1C263A !important;
            border-top-left-radius: 4px !important;
        }

        .msg-row.user .msg-bubble {
            background: #243B64 !important;
            color: #FFFFFF !important;
            border-top-right-radius: 4px !important;
        }

        /* 챗봇 말풍선 내부 전셈 TIP 카드 */
        .chat-tip-box {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed #CBD5E1;
        }

        .chat-tip-title {
            font-weight: 800;
            color: #1C263A;
            margin-bottom: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-tip-desc {
            font-size: 13.5px;
            color: #4B5566;
            line-height: 1.55;
            margin: 0;
            word-break: keep-all;
        }

        /* 말풍선 바깥 전용 액션 버튼 (말풍선과 가로폭 100% 동일) */
        .btn-chat-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100% !important;
            background-color: #243B64;
            color: #FFFFFF !important;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            box-sizing: border-box !important;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(36, 59, 100, 0.15);
        }

        .btn-chat-action:hover {
            background-color: #16233D;
            transform: translateY(-1px);
        }

        /* 생각 중 애니메이션 */
        .thinking-bubble {
            display: flex !important;
            align-items: center;
            gap: 5px;
            padding: 14px 20px !important;
            width: auto !important;
        }

        .dot-flashing {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #7C879A;
            animation: dotFlashing 1s infinite alternate;
        }

        .dot-flashing:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot-flashing:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotFlashing {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* 추천 칩 그룹 */
        .chip-group {
            display: flex;
            gap: 8px;
            padding: 12px 28px;
            overflow-x: auto;
            background: #FAFAFC;
            flex-shrink: 0;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .chip-btn {
            border: 1.5px solid #243B64;
            background: #FFFFFF;
            color: #243B64;
            font-weight: 700;
            font-size: 13.5px;
            padding: 8px 16px;
            border-radius: 999px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .chip-btn:hover {
            background: #243B64;
            color: #FFFFFF;
        }

        /* 하단 입력 폼 */
        .chat-footer {
            padding: 16px 20px;
            border-top: 1px solid #F1F3F7;
            background: #FFFFFF;
            flex-shrink: 0;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .chat-input-form {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .btn-attach {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #EBF0F7;
            border: none;
            font-size: 20px;
            color: #4B5566;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1 !important;
            width: 100% !important;
            min-width: 0 !important;
            border: none;
            outline: none;
            font-size: 15px;
            color: #1C263A;
            font-family: inherit;
        }

        .chat-input::placeholder {
            color: #9EA8B6;
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #D7DEE8;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.15s;
        }

        .btn-send.active {
            background: #243B64;
        }

        @media (max-width: 620px) {
            .chat-container {
                height: 88vh !important;
                border-radius: 0 !important;
            }

            .chat-body {
                padding: 0 16px 16px;
            }

            .welcome-hero-banner {
                width: calc(100% + 32px);
                margin: 0 -16px 12px -16px;
            }
        }
    </style>
</head>

<body>

    <!-- ============ MAIN SITE HEADER ============ -->
    <header>
        <div class="wrap nav">
            <a href="../index.html" class="logo">
                <img src="../images/logo.png" width="40" alt="전셈 로고">
                전셈
            </a>
            <nav class="nav-menu">
                <a href="../index.html#services">서비스 소개</a>
                <a href="../index.html#diagnosis-section">안전진단</a>
                <a href="chat.html" style="color:var(--blue, #243B64); font-weight:800;">AI 챗봇</a>
                <a href="../index.html#footer">고객지원</a>
            </nav>
        </div>
    </header>

    <!-- ============ CHAT SECTION ============ -->
    <section class="chat-sec">
        <div class="chat-container">

            <!-- 챗봇 상단 내부 헤더 -->
            <div class="chat-header">
                <div class="chat-header-logo">
                    <img src="../images/chat.png" width="28" alt="전셈">
                    전셈 안심 상담
                </div>
                <div class="chat-header-actions">
                    <button type="button" class="btn-new-chat" onclick="resetChat()">
                        + 새 상담
                    </button>
                    <a href="../index.html" class="btn-close" title="홈으로 나가기">✕</a>
                </div>
            </div>

            <!-- 대화 본문 영역 -->
            <div class="chat-body" id="chatBody">

                <!-- 1. 초기 웰컴 배너 (첫 메시지 전송 시 숨김) -->
                <div class="welcome-hero-banner" id="welcomeBanner">
                    <img src="../images/relax.png" alt="전셈이 쉼" class="welcome-mascot-img">
                    <h2 class="welcome-title">
                        전셈과 함께<br>안전하게 전세 계약해요
                    </h2>
                </div>

                <!-- 2. 메시지 목록 -->
                <div class="messages-list" id="messagesList">
                    <div class="msg-row bot">
                        <div class="msg-bubble">
                            안녕하세요! 전세 계약 중 궁금한 점이나 걱정되는 상황을 편하게 말씀해주세요.
                        </div>
                    </div>
                </div>

            </div>

            <!-- 추천 질문 칩 -->
            <div class="chip-group">
                <button class="chip-btn" onclick="sendQuickMsg('등기부등본 분석 받기')">등기부등본 분석 받기</button>
                <button class="chip-btn" onclick="sendQuickMsg('특약 문구 알려줘')">특약 문구 알려줘</button>
                <button class="chip-btn" onclick="sendQuickMsg('보증금 못 받으면?')">보증금 못 받으면?</button>
            </div>

            <!-- 하단 입력창 -->
            <div class="chat-footer">
                <form class="chat-input-form" onsubmit="handleSend(event)">
                    <button type="button" class="btn-attach" onclick="location.href='upload.html'">+</button>
                    <input type="text" id="userInput" class="chat-input" placeholder="상황을 입력해보세요 (예: 전세가율이 뭔가요?)"
                        autocomplete="off" oninput="toggleSendBtn()">
                    <button type="submit" id="btnSend" class="btn-send">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </form>
            </div>

        </div>
    </section>

    <script>
        const chatBody = document.getElementById('chatBody');
        const messagesList = document.getElementById('messagesList');
        const userInput = document.getElementById('userInput');
        const welcomeBanner = document.getElementById('welcomeBanner');
        const btnSend = document.getElementById('btnSend');

        let isFirstMessage = true;

        function toggleSendBtn() {
            if (userInput.value.trim().length > 0) {
                btnSend.classList.add('active');
            } else {
                btnSend.classList.remove('active');
            }
        }

        function hideWelcomeBanner() {
            if (isFirstMessage) {
                if (welcomeBanner) {
                    welcomeBanner.style.display = 'none';
                }
                isFirstMessage = false;
            }
        }

        function handleSend(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            hideWelcomeBanner();
            appendUserMsg(text);
            userInput.value = '';
            toggleSendBtn();

            processBotReply(text);
        }

        function sendQuickMsg(text) {
            hideWelcomeBanner();
            appendUserMsg(text);
            processBotReply(text);
        }

        function appendUserMsg(text) {
            const row = document.createElement('div');
            row.className = 'msg-row user';
            row.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
            messagesList.appendChild(row);
            scrollToBottom();
        }

        function processBotReply(userText) {
            showThinking();

            setTimeout(() => {
                removeThinking();

                let replyHtml = "";
                let hasActionButton = false;

                if (userText.includes("등기부등본")) {
                    // 1. 등기부등본 분석 받기 (말풍선 본문)
                    replyHtml = `
                        <div style="line-height: 1.6; word-break: keep-all;">
                            <p style="margin: 0 0 10px;">네! 등기부등본을 분석하면 근저당권, 압류·가압류 등 주요 위험요소를 확인할 수 있어요.</p>
                            <p style="margin: 0;">등기부등본을 준비하셨다면 분석 페이지에서 바로 확인해볼까요?</p>
                        </div>
                    `;
                    hasActionButton = true;
                } else if (userText.includes("특약")) {
                    // 2. 특약 문구 알려줘
                    replyHtml = `
                        <div style="line-height: 1.6; word-break: keep-all;">
                            <p style="margin: 0 0 10px;">전세 계약에서는 특약을 어떻게 넣느냐에 따라 나중에 문제가 생겼을 때 내 보증금을 지키는 데 도움이 될 수 있어요.</p>
                            <p style="margin: 0 0 10px;">특히 계약 후 집에 새로운 근저당권이 설정되거나 집주인이 바뀌는 상황을 대비한 특약을 확인해두는 게 좋아요.</p>
                            <p style="margin: 0 0 14px;">계약서가 있다면 보내주세요. 현재 들어가 있는 특약을 확인하고, 빠진 내용이 있는지도 함께 살펴드릴게요!</p>
                            
                            <div class="chat-tip-box">
                                <div class="chat-tip-title">💡 전셈 TIP</div>
                                <p class="chat-tip-desc" style="margin-bottom: 8px;">예를 들어 "임대인은 잔금 지급일 다음 날까지 새로운 근저당권 등 권리관계를 설정하지 않는다"와 같은 특약을 넣을 수 있어요.</p>
                                <p class="chat-tip-desc">또 잔금과 입주가 완료된 후 전입신고와 확정일자를 받을 수 있도록 관련 내용을 특약에 명확히 적는 방법도 있어요.</p>
                            </div>
                        </div>
                    `;
                } else if (userText.includes("보증금")) {
                    // 3. 보증금 못 받으면?
                    replyHtml = `
                        <div style="line-height: 1.6; word-break: keep-all;">
                            <p style="margin: 0 0 10px;">계약이 끝났는데도 집주인이 보증금을 돌려주지 않는다면, 바로 이사를 나가기보다 먼저 내 보증금을 지킬 수 있는 상태인지 확인하는 게 중요해요.</p>
                            <p style="margin: 0 0 10px;">아직 집을 비우지 않았다면 전입신고와 점유를 유지하면서 보증금을 돌려받을 때까지 기다리는 방법을 먼저 생각해볼 수 있어요.</p>
                            <p style="margin: 0 0 10px;">만약 꼭 이사를 가야 한다면 임차권등기명령을 신청해 대항력과 우선변제권을 유지할 수 있는지 확인해야 해요. 이후에도 보증금을 받지 못한다면 보증금 반환을 청구하는 절차를 진행할 수 있어요.</p>
                            <p style="margin: 0 0 14px;">지금 보증금을 못 받고 있는 상황이라면 계약 만료일과 전입신고 여부, 확정일자 여부를 알려주세요. 현재 상황에서 어떤 절차를 먼저 확인해야 하는지 같이 살펴볼게요.</p>
                            
                            <div class="chat-tip-box">
                                <div class="chat-tip-title">💡 전셈 TIP</div>
                                <p class="chat-tip-desc">보증금을 받기 전에 무작정 전출하거나 집을 비우지 않는 거예요. 상황에 따라 내 권리를 잃을 수 있기 때문에, 이사하기 전에 현재 계약 상태를 먼저 확인하는 게 좋아요.</p>
                            </div>
                        </div>
                    `;
                } else {
                    replyHtml = `
                        <div style="line-height: 1.6; word-break: keep-all;">
                            네! 세입자님의 안전한 전세 계약을 위해 언제든 상담해 드릴게요. 궁금한 점이나 서류 분석이 필요하시면 편하게 말씀해 주세요.
                        </div>
                    `;
                }

                appendBotMsg(replyHtml, hasActionButton);
            }, 800);
        }

        function appendBotMsg(text, hasActionButton = false) {
            const row = document.createElement('div');
            row.className = 'msg-row bot';

            // 말풍선 추가
            let content = `<div class="msg-bubble">${text}</div>`;

            // 말풍선 바깥에 버튼 배치
            if (hasActionButton) {
                content += `
                    <a href="upload.html" class="btn-chat-action">
                        등기부등본 분석하러 가기 →
                    </a>
                `;
            }

            row.innerHTML = content;
            messagesList.appendChild(row);
            scrollToBottom();
        }

        function showThinking() {
            const row = document.createElement('div');
            row.className = 'msg-row bot';
            row.id = 'thinkingRow';
            row.innerHTML = `
                <div class="msg-bubble thinking-bubble">
                    <div class="dot-flashing"></div>
                    <div class="dot-flashing"></div>
                    <div class="dot-flashing"></div>
                </div>`;
            messagesList.appendChild(row);
            scrollToBottom();
        }

        function removeThinking() {
            const thinkingRow = document.getElementById('thinkingRow');
            if (thinkingRow) thinkingRow.remove();
        }

        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function resetChat() {
            messagesList.innerHTML = `
                <div class="msg-row bot">
                    <div class="msg-bubble">
                        안녕하세요! 전세 계약 중 궁금한 점이나 걱정되는 상황을 편하게 말씀해주세요.
                    </div>
                </div>
            `;
            if (welcomeBanner) {
                welcomeBanner.style.display = 'flex';
            }
            isFirstMessage = true;
            userInput.value = '';
            toggleSendBtn();
            scrollToBottom();
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
            });
        }
    </script>
</body>

</html>
