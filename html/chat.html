<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전셈 | AI 안심 상담</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* 화면 전체 가로 스크롤 방지 */
        html,
        body {
            overflow-x: hidden !important;
            background: #F4F6FA;
            margin: 0;
            padding: 0;
        }

        .chat-sec {
            padding: 30px 16px 50px;
            display: flex;
            justify-content: center;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        /* 챗봇 전체 컨테이너 */
        .chat-container {
            width: 100% !important;
            max-width: 760px !important;
            min-width: 320px !important;
            height: 750px !important;
            max-height: 82vh !important;
            background: #FFFFFF;
            border-radius: var(--radius-lg, 28px);
            border: 1px solid var(--gray-100, #F1F3F7);
            box-shadow: var(--shadow-pop, 0 16px 40px rgba(36, 59, 100, 0.12));
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
            position: relative;
        }

        /* 상단 챗봇 컨트롤 헤더 */
        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid #F1F3F7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            flex-shrink: 0;
            z-index: 10;
        }

        .chat-header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            color: #1C263A;
            text-decoration: none;
        }

        .chat-header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 새 상담 버튼 */
        .btn-new-chat {
            background: #E8EEF8;
            color: #243B64;
            border: none;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .btn-new-chat:hover {
            background: #DCE5F5;
        }

        /* 닫기 버튼 */
        .btn-close {
            color: #7C879A;
            font-size: 20px;
            font-weight: 500;
            text-decoration: none;
            padding: 4px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .btn-close:hover {
            color: #1C263A;
        }

        /* 메시지 대화창 */
        .chat-body {
            flex: 1 1 0% !important;
            min-height: 0 !important;
            min-width: 0 !important;
            width: 100% !important;
            padding: 0 28px 24px;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            background: #FAFAFC;
            box-sizing: border-box !important;
        }

        /* 첫 화면 연녹색 그라데이션 및 마스코트 배너 */
        .welcome-hero-banner {
            width: calc(100% + 56px);
            margin: 0 -28px 12px -28px;
            padding: 36px 20px 32px;
            background: linear-gradient(180deg, #E6F7ED 0%, #FAFAFC 100%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .welcome-mascot-img {
            width: 135px;
            height: auto;
            margin-bottom: 14px;
            display: block;
        }

        .welcome-title {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.4;
            color: #1C263A;
            margin: 0;
            word-break: keep-all;
        }

        /* 메시지 컨테이너 */
        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            padding-top: 24px;
        }

        .msg-row {
            display: flex !important;
            flex-direction: column !important;
            gap: 8px;
            max-width: 85% !important;
            min-width: 0 !important;
            box-sizing: border-box !important;
        }

        .msg-row.bot {
            align-self: flex-start !important;
        }

        .msg-row.user {
            align-self: flex-end !important;
        }

        /* 말풍선 스타일 */
        .msg-bubble {
            padding: 14px 18px !important;
            border-radius: 18px !important;
            font-size: 15px !important;
            line-height: 1.6 !important;
            width: 100% !important;
            box-sizing: border-box !important;
            word-break: keep-all !important;
            overflow-wrap: break-word !important;
        }

        .msg-row.bot .msg-bubble {
            background: #EDF2F8 !important;
            color: #1C263A !important;
            border-top-left-radius: 4px !important;
        }

        .msg-row.user .msg-bubble {
            background: #243B64 !important;
            color: #FFFFFF !important;
            border-top-right-radius: 4px !important;
        }

        /* 챗봇 말풍선 내부 전셈 TIP 카드 */
        .chat-tip-box {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed #CBD5E1;
        }

        .chat-tip-title {
            font-weight: 800;
            color: #1C263A;
            margin-bottom: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-tip-desc {
            font-size: 13.5px;
            color: #4B5566;
            line-height: 1.55;
            margin: 0;
            word-break: keep-all;
        }

        /* 말풍선 바깥 전용 액션 버튼 (말풍선과 가로폭 100% 동일) */
        .btn-chat-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100% !important;
            background-color: #243B64;
            color: #FFFFFF !important;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            box-sizing: border-box !important;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(36, 59, 100, 0.15);
        }

        .btn-chat-action:hover {
            background-color: #16233D;
            transform: translateY(-1px);
        }

        /* 생각 중 애니메이션 */
        .thinking-bubble {
            display: flex !important;
            align-items: center;
            gap: 5px;
            padding: 14px 20px !important;
            width: auto !important;
        }

        .dot-flashing {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #7C879A;
            animation: dotFlashing 1s infinite alternate;
        }

        .dot-flashing:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot-flashing:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotFlashing {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* 추천 칩 그룹 */
        .chip-group {
            display: flex;
            gap: 8px;
            padding: 12px 28px;
            overflow-x: auto;
            background: #FAFAFC;
            flex-shrink: 0;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .chip-btn {
            border: 1.5px solid #243B64;
            background: #FFFFFF;
            color: #243B64;
            font-weight: 700;
            font-size: 13.5px;
            padding: 8px 16px;
            border-radius: 999px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .chip-btn:hover {
            background: #243B64;
            color: #FFFFFF;
        }

        /* 하단 입력 폼 */
        .chat-footer {
            padding: 16px 20px;
            border-top: 1px solid #F1F3F7;
            background: #FFFFFF;
            flex-shrink: 0;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .chat-input-form {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .btn-attach {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #EBF0F7;
            border: none;
            font-size: 20px;
            color: #4B5566;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1 !important;
            width: 100% !important;
            min-width: 0 !important;
            border: none;
            outline: none;
            font-size: 15px;
            color: #1C263A;
            font-family: inherit;
        }

        .chat-input::placeholder {
            color: #9EA8B6;
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #D7DEE8;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.15s;
        }

        .btn-send.active {
            background: #243B64;
        }

        @media (max-width: 620px) {
            .chat-container {
                height: 88vh !important;
                border-radius: 0 !important;
            }

            .chat-body {
                padding: 0 16px 16px;
            }

            .welcome-hero-banner {
                width: calc(100% + 32px);
                margin: 0 -16px 12px -16px;
            }
        }
    </style>
</head>

<body>

    <!-- ============ MAIN SITE HEADER ============ -->
    <header>
        <div class="wrap nav">
            <a href="../index.html" class="logo">
                <img src="../images/logo.png" width="40" alt="전셈 로고">
                전셈
            </a>
            <nav class="nav-menu">
                <a href="../index.html#services">서비스 소개</a>
                <a href="../index.html#diagnosis">안전진단</a>
                <a href="chat.html" style="color:var(--blue, #243B64); font-weight:800;">AI 챗봇</a>
                <a href="../index.html#notice">고객지원</a>
            </nav>
        </div>
    </header>

    <!-- ============ CHAT SECTION ============ -->
    <section class="chat-sec">
        <div class="chat-container">

            <!-- 챗봇 상단 내부 헤더 -->
            <div class="chat-header">
                <div class="chat-header-logo">
                    <img src="../images/chat.png" width="28" alt="전셈">
                    전셈 안심 상담
                </div>
                <div class="chat-header-actions">
                    <button type="button" class="btn-new-chat" onclick="resetChat()">
                        + 새 상담
                    </button>
                    <a href="../index.html" class="btn-close" title="홈으로 나가기">✕</a>
                </div>
            </div>

            <!-- 대화 본문 영역 -->
            <div class="chat-body" id="chatBody">

                <!-- 1. 초기 웰컴 배너 (첫 메시지 전송 시 숨김) -->
                <div class="welcome-hero-banner" id="welcomeBanner">
                    <img src="../images/relax.png" alt="전셈이 쉼" class="welcome-mascot-img">
                    <h2 class="welcome-title">
                        전셈과 함께<br>안전하게 전세 계약해요
                    </h2>
                </div>

                <!-- 2. 메시지 목록 -->
                <div class="messages-list" id="messagesList">
                    <div class="msg-row bot">
                        <div class="msg-bubble">
                            안녕하세요! 전세 계약 중 궁금한 점이나 걱정되는 상황을 편하게 말씀해주세요.
                        </div>
                    </div>
                </div>

            </div>

            <!-- 추천 질문 칩 -->
            <div class="chip-group">
                <button class="chip-btn" onclick="sendQuickMsg('등기부등본 분석 받기')">등기부등본 분석 받기</button>
                <button class="chip-btn" onclick="sendQuickMsg('특약 문구 알려줘')">특약 문구 알려줘</button>
                <button class="chip-btn" onclick="sendQuickMsg('보증금 못 받으면?')">보증금 못 받으면?</button>
            </div>

            <!-- 하단 입력창 -->
            <div class="chat-footer">
                <form class="chat-input-form" onsubmit="handleSend(event)">
                    <button type="button" class="btn-attach" onclick="location.href='upload.html'">+</button>
                    <input type="text" id="userInput" class="chat-input" placeholder="상황을 입력해보세요 (예: 전세가율이 뭔가요?)"
                        autocomplete="off" oninput="toggleSendBtn()">
                    <button type="submit" id="btnSend" class="btn-send">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </form>
            </div>

        </div>
    </section>

    <script>
        const chatBody = document.getElementById('chatBody');
        const messagesList = document.getElementById('messagesList');
        const userInput = document.getElementById('userInput');
        const welcomeBanner = document.getElementById('welcomeBanner');
        const btnSend = document.getElementById('btnSend');

        let isFirstMessage = true;

        /* ========================================================
           부동산 및 전세 지식 베이스 (Knowledge Base)
           ======================================================== */
        const KNOWLEDGE_BASE = [
            {
                keywords: ["임대인이 뭐", "임대인이란", "임대인 뜻", "임대인?"],
                reply: "임대인은 집(부동산)을 빌려주는 사람, 즉 집주인을 말해요. 계약서에는 '갑'으로 표시되는 경우가 많아요."
            },
            {
                keywords: ["임차인이 뭐", "임차인이란", "임차인 뜻", "임차인?"],
                reply: "임차인은 돈을 내고 집을 빌려 쓰는 사람, 즉 세입자를 말해요. 계약서에는 '을'로 표시되는 경우가 많아요."
            },
            {
                keywords: ["전세가 뭐", "전세란", "전세 뜻"],
                reply: "전세는 임차인이 큰 목돈(보증금)을 임대인에게 맡기고 별도의 월세 없이 집을 빌려 쓰는 임대차 방식이에요. 계약이 끝나면 보증금을 그대로 돌려받아요."
            },
            {
                keywords: ["월세가 뭐", "월세란", "월세 뜻"],
                reply: "월세는 임차인이 상대적으로 적은 보증금을 내고, 매달 정해진 임대료(월세)를 추가로 지불하며 집을 빌려 쓰는 방식이에요."
            },
            {
                keywords: ["계약금이 뭐", "계약금이란", "계약금 뜻"],
                reply: "계약금은 계약을 체결할 때 보증금의 일부(보통 10%)를 먼저 지급하는 돈으로, 계약이 성립되었다는 증거금 역할을 해요."
            },
            {
                keywords: ["중도금이 뭐", "중도금이란", "중도금 뜻"],
                reply: "중도금은 계약금과 잔금 사이에 추가로 지급하는 돈이에요. 전세 계약에서는 생략되는 경우도 많아요."
            },
            {
                keywords: ["잔금이 뭐", "잔금이란", "잔금 뜻"],
                reply: "잔금은 계약금(및 중도금)을 제외한 나머지 보증금 전액으로, 통상 입주(이사)일에 지급하고 이때 전입신고와 확정일자를 함께 받는 것이 안전해요."
            },
            {
                keywords: ["임대차계약", "임대차 계약이란"],
                reply: "임대차계약은 임대인이 집을 빌려주고 임차인이 그 대가(보증금·월세)를 지급하기로 약속하는 계약이에요. 전세와 월세 모두 임대차계약의 한 종류예요."
            },
            {
                keywords: ["전세권"],
                reply: "전세권은 임차인이 등기부에 직접 자신의 권리를 등록하는 물권으로, 집주인의 동의가 필요해요. 실무에서는 등기 없이도 대항력·우선변제권을 갖출 수 있어 전세권 등기까지 하는 경우는 드물어요."
            },
            {
                keywords: ["공인중개사"],
                reply: "공인중개사는 부동산 거래를 중개하는 자격을 가진 사람이에요. 계약 전 중개사 자격증과 등록번호를 국가공간정보포털 등에서 확인하면 무자격 중개 사기를 예방할 수 있어요."
            },
            {
                keywords: ["표준임대차계약서", "표준계약서"],
                reply: "표준임대차계약서는 국토교통부가 배포하는 공식 양식으로, 확정일자 부여 현황·선순위 채권 등 임차인 보호 조항이 기본 포함되어 있어 일반 양식보다 안전해요."
            },
            {
                keywords: ["임대인 의무", "집주인 의무"],
                reply: "임대인은 계약 기간 동안 집을 사용할 수 있게 해줄 의무, 하자를 수선할 의무, 계약 종료 시 보증금을 돌려줄 의무가 있어요."
            },
            {
                keywords: ["임차인 의무", "세입자 의무"],
                reply: "임차인은 월세(있는 경우)를 제때 낼 의무, 집을 계약된 용도로만 사용할 의무, 계약 종료 시 원상복구해서 반환할 의무가 있어요."
            },
            {
                keywords: ["등기부등본", "갑구", "을구"],
                reply: "등기부등본은 갑구(소유권)와 을구(근저당, 전세권)를 반드시 확인해야 해요. 상단 메뉴의 '안전진단'을 이용하시면 AI가 1초 만에 권리분석을 완료해 드려요!"
            },
            {
                keywords: ["특약", "특약사항"],
                reply: "가장 필수적인 특약은 '임대인은 잔금일 다음 날까지 담보권 설정을 하지 않는다'와 '전세대출 및 보증보험 미승인 시 계약금 전액 반환' 조항입니다."
            },
            {
                keywords: ["보증금 못", "보증금 반환", "보증금 안", "보증금 미반환"],
                reply: "보증금을 제때 돌려받지 못할 위험을 막기 위해 HUG/SGI 보증보험 가입과 입주 당일 전입신고·확정일자 확보가 가장 중요합니다."
            },
            {
                keywords: ["전세가율"],
                reply: "전세가율은 '전세보증금 ÷ 매매가(시세)'로 계산해요. 통상 70~80%를 넘으면 집값이 조금만 떨어져도 보증금을 돌려받기 어려운 '깡통전세' 위험이 커지니 주의하셔야 해요."
            },
            {
                keywords: ["깡통전세"],

            },
            {

                reply: "등기부등본에 '신탁'이 기재된 집은 소유권이 신탁회사에 있을 수 있어요. 신탁원부를 확인해서 신탁회사의 동의 없이 임대차 계약이 체결된 경우 계약이 무효가 될 수 있으니 주의하세요."
            },
            {

            },

            },
            {

                reply: "다가구주택은 건물 전체가 1개의 등기로 되어 있어 여러 세입자의 선순위를 파악하기 어려워요. 계약 전 '임대차 정보 제공 요청'으로 다른 세입자들의 확정일자·보증금 현황을 꼭 확인하세요."

            },
            {

            },
            {
                keywords: ["계약 전 체크리스트", "체크리스트"],
                reply: "핵심 체크리스트는 ① 등기부등본(갑구·을구) 확인, ② 전세가율 계산, ③ 임대인 세금 체납 확인, ④ 확정일자·전입신고 당일 처리, ⑤ 보증보험 가입 가능 여부예요. '계약 체크리스트' 메뉴에서 더 자세히 확인할 수 있어요."
            },
            {
                keywords: ["분쟁", "소송"],
                reply: "보증금 미반환이나 임차권등기명령 등 분쟁이 생기면 '분쟁 대응 가이드' 메뉴에서 상황별 법적 절차를 안내받을 수 있어요. 내용증명 발송, 임차권등기명령, 지급명령·보증금반환소송 순서로 진행하는 경우가 많아요."
            }
        ];

        function toggleSendBtn() {
            if (userInput.value.trim().length > 0) {
                btnSend.classList.add('active');
            } else {
                btnSend.classList.remove('active');
            }
        }

        function hideWelcomeBanner() {
            if (isFirstMessage) {
                if (welcomeBanner) {
                    welcomeBanner.style.display = 'none';
                }
                isFirstMessage = false;
            }
        }

        function handleSend(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            hideWelcomeBanner();
            appendUserMsg(text);
            userInput.value = '';
            toggleSendBtn();

            processBotReply(text);
        }

        function sendQuickMsg(text) {
            hideWelcomeBanner();
            appendUserMsg(text);
            processBotReply(text);
        }

        function appendUserMsg(text) {
            const row = document.createElement('div');
            row.className = 'msg-row user';
            row.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
            messagesList.appendChild(row);
            scrollToBottom();
        }

        /* 챗봇 대화 분석 및 응답 처리 */
        function processBotReply(userText) {
            showThinking();

            setTimeout(() => {
                removeThinking();

                let replyHtml = "";
                let hasActionButton = false;
                const cleanText = userText.replace(/\s+/g, '');

                // 1. 전용 시나리오: 등기부등본 분석 받기
                if (userText.includes("등기부등본 분석") || userText === "등기부등본 분석 받기") {
                    replyHtml = `
                        <div style="line-height: 1.6; word-break: keep-all;">
                            <p style="margin: 0 0 10px;">네! 등기부등본을 분석하면 근저당권, 압류·가압류 등 주요 위험요소를 확인할 수 있어요.</p>
                            <p style="margin: 0;">등기부등본을 준비하셨다면 분석 페이지에서 바로 확인해볼까요?</p>
                        </div>
                    `;
                    hasActionButton = true;
                }
                // 2. 전용 시나리오: 특약 문구 알려줘
                else if (userText.includes("특약 문구") || userText === "특약 문구 알려줘") {
                    replyHtml = `
                        <div style="line-height: 1.6; word-break: keep-all;">
                            <p style="margin: 0 0 10px;">전세 계약에서는 특약을 어떻게 넣느냐에 따라 나중에 문제가 생겼을 때 내 보증금을 지키는 데 도움이 될 수 있어요.</p>
                            <p style="margin: 0 0 10px;">특히 계약 후 집에 새로운 근저당권이 설정되거나 집주인이 바뀌는 상황을 대비한 특약을 확인해두는 게 좋아요.</p>
                            <p style="margin: 0 0 14px;">계약서가 있다면 보내주세요. 현재 들어가 있는 특약을 확인하고, 빠진 내용이 있는지도 함께 살펴드릴게요!</p>
                            
                            <div class="chat-tip-box">
                                <div class="chat-tip-title">💡 전셈 TIP</div>
                                <p class="chat-tip-desc" style="margin-bottom: 8px;">예를 들어 "임대인은 잔금 지급일 다음 날까지 새로운 근저당권 등 권리관계를 설정하지 않는다"와 같은 특약을 넣을 수 있어요.</p>
                                <p class="chat-tip-desc">또 잔금과 입주가 완료된 후 전입신고와 확정일자를 받을 수 있도록 관련 내용을 특약에 명확히 적는 방법도 있어요.</p>
                            </div>
                        </div>
                    `;
                }
                // 3. 전용 시나리오: 보증금 못 받으면?
                else if (userText.includes("보증금 못 받으면") || userText === "보증금 못 받으면?") {
                    replyHtml = `
                        <div style="line-height: 1.6; word-break: keep-all;">
                            <p style="margin: 0 0 10px;">계약이 끝났는데도 집주인이 보증금을 돌려주지 않는다면, 바로 이사를 나가기보다 먼저 내 보증금을 지킬 수 있는 상태인지 확인하는 게 중요해요.</p>
                            <p style="margin: 0 0 10px;">아직 집을 비우지 않았다면 전입신고와 점유를 유지하면서 보증금을 돌려받을 때까지 기다리는 방법을 먼저 생각해볼 수 있어요.</p>
                            <p style="margin: 0 0 10px;">만약 꼭 이사를 가야 한다면 임차권등기명령을 신청해 대항력과 우선변제권을 유지할 수 있는지 확인해야 해요. 이후에도 보증금을 받지 못한다면 보증금 반환을 청구하는 절차를 진행할 수 있어요.</p>
                            <p style="margin: 0 0 14px;">지금 보증금을 못 받고 있는 상황이라면 계약 만료일과 전입신고 여부, 확정일자 여부를 알려주세요. 현재 상황에서 어떤 절차를 먼저 확인해야 하는지 같이 살펴볼게요.</p>
                            
                            <div class="chat-tip-box">
                                <div class="chat-tip-title">💡 전셈 TIP</div>
                                <p class="chat-tip-desc">보증금을 받기 전에 무작정 전출하거나 집을 비우지 않는 거예요. 상황에 따라 내 권리를 잃을 수 있기 때문에, 이사하기 전에 현재 계약 상태를 먼저 확인하는 게 좋아요.</p>
                            </div>
                        </div>
                    `;
                }
                // 4. KNOWLEDGE_BASE 키워드 매칭
                else {
                    let matchedItem = null;
                    for (const item of KNOWLEDGE_BASE) {
                        const isMatch = item.keywords.some(kw => {
                            const cleanKw = kw.replace(/\s+/g, '');
                            return userText.includes(kw) || cleanText.includes(cleanKw);
                        });
                        if (isMatch) {
                            matchedItem = item;
                            break;
                        }
                    }

                    if (matchedItem) {
                        replyHtml = `
                            <div style="line-height: 1.6; word-break: keep-all;">
                                ${escapeHtml(matchedItem.reply)}
                            </div>
                        `;
                    } else {
                        replyHtml = `
                            <div style="line-height: 1.6; word-break: keep-all;">
                                네! 세입자님의 안전한 전세 계약을 위해 언제든 상담해 드릴게요. 궁금한 점이나 서류 분석이 필요하시면 편하게 말씀해 주세요.
                            </div>
                        `;
                    }
                }

                appendBotMsg(replyHtml, hasActionButton);
            }, 700);
        }

        function appendBotMsg(text, hasActionButton = false) {
            const row = document.createElement('div');
            row.className = 'msg-row bot';

            let content = `<div class="msg-bubble">${text}</div>`;

            if (hasActionButton) {
                content += `
                    <a href="upload.html" class="btn-chat-action">
                        등기부등본 분석하러 가기 →
                    </a>
                `;
            }

            row.innerHTML = content;
            messagesList.appendChild(row);
            scrollToBottom();
        }

        function showThinking() {
            const row = document.createElement('div');
            row.className = 'msg-row bot';
            row.id = 'thinkingRow';
            row.innerHTML = `
                <div class="msg-bubble thinking-bubble">
                    <div class="dot-flashing"></div>
                    <div class="dot-flashing"></div>
                    <div class="dot-flashing"></div>
                </div>`;
            messagesList.appendChild(row);
            scrollToBottom();
        }

        function removeThinking() {
            const thinkingRow = document.getElementById('thinkingRow');
            if (thinkingRow) thinkingRow.remove();
        }

        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function resetChat() {
            messagesList.innerHTML = `
                <div class="msg-row bot">
                    <div class="msg-bubble">
                        안녕하세요! 전세 계약 중 궁금한 점이나 걱정되는 상황을 편하게 말씀해주세요.
                    </div>
                </div>
            `;
            if (welcomeBanner) {
                welcomeBanner.style.display = 'flex';
            }
            isFirstMessage = true;
            userInput.value = '';
            toggleSendBtn();
            scrollToBottom();
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
            });
        }
    </script>
</body>

</html>
