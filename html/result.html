<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전셈 | 진단 결과</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .result-sec {
            padding: 40px 0 80px;
            display: flex;
            justify-content: center;
        }

        .result-container {
            width: 100%;
            max-width: 720px;
            box-sizing: border-box;
        }

        .result-header {
            margin-bottom: 24px;
        }

        .result-header .brand {
            font-size: 18px;
            font-weight: 800;
            color: var(--blue, #243B64);
            margin-bottom: 4px;
        }

        .result-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--ink, #1C263A);
            margin: 0;
        }

        /* 메인 결과 비주얼 & 타이틀 */
        .result-hero {
            text-align: center;
            margin-bottom: 36px;
        }

        .result-hero-img {
            width: 140px;
            height: auto;
            margin: 0 auto 16px;
            display: block;
        }

        .result-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--ink, #1C263A);
            margin-bottom: 12px;
        }

        .risk-badge-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-700, #4B5566);
            margin-bottom: 14px;
        }

        /* 뱃지 스타일 */
        .badge-warning {
            background: #FFF3E0;
            color: #E65100;
            font-weight: 800;
            font-size: 13.5px;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .badge-safe {
            background: #E8F5E9;
            color: #2E7D32;
            font-weight: 800;
            font-size: 13.5px;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .result-desc {
            font-size: 15px;
            color: var(--gray-500, #7C879A);
            line-height: 1.55;
            margin: 0;
            word-break: keep-all;
        }

        /* 2열 진단 결과 카드 그리드 */
        .result-grid {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 16px !important;
            margin-bottom: 16px !important;
        }

        /* 확인 불가 전용 1열 카드를 위한 공간 */
        .full-width-area {
            margin-bottom: 32px;
        }

        /* 하단 안내 텍스트 */
        .ai-guide-text {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #7C879A;
            margin-bottom: 14px;
        }

        /* 하단 버튼 영역 */
        .result-actions {
            border-top: 1px solid var(--gray-300, #D7DEE8);
            padding-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-ask-ai {
            width: 100%;
            background: var(--navy, #243B64);
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            padding: 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(36, 59, 100, 0.18);
            transition: background 0.15s, transform 0.15s;
            box-sizing: border-box;
        }

        .btn-ask-ai:hover {
            background: var(--blue-900, #16233D);
            transform: translateY(-2px);
        }

        .btn-retest {
            width: 100%;
            background: #FFFFFF;
            color: var(--navy, #243B64);
            border: 1.5px solid var(--gray-300, #D7DEE8);
            font-size: 17px;
            font-weight: 800;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: border-color 0.15s, transform 0.15s;
            box-sizing: border-box;
        }

        .btn-retest:hover {
            border-color: var(--navy, #243B64);
            transform: translateY(-2px);
        }

        .btn-home-link {
            display: block;
            text-align: center;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--gray-500, #7C879A);
            text-decoration: underline;
            margin-top: 12px;
        }

        .btn-home-link:hover {
            color: var(--blue, #243B64);
        }

        @media (max-width: 620px) {
            .result-grid {
                grid-template-columns: 1fr !important;
            }

            .result-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="wrap nav">
            <a href="../index.html" class="logo">
                <img src="../images/logo.png" width="40" alt="전셈 로고">
                전셈
            </a>
            <nav class="nav-menu">
                <a href="../index.html#services">서비스 소개</a>
                <a href="../index.html#diagnosis-section">안전진단</a>
                <a href="chat.html">AI 챗봇</a>
                <a href="../index.html#footer">고객지원</a>
            </nav>
        </div>
    </header>

    <!-- MAIN RESULT SECTION -->
    <section class="result-sec">
        <div class="wrap" style="display:flex; justify-content:center;">
            <div class="result-container">

                <!-- 상단 제목 -->
                <div class="result-header">
                    <div class="brand"></div>
                    <h1>진단 결과</h1>
                </div>

                <!-- 메인 결과 비주얼 및 서머리 -->
                <div class="result-hero" id="resultHero">
                    <!-- 스크립트에서 동적 생성 -->
                </div>

                <!-- 2열 진단 카드 영역 -->
                <div class="result-grid" id="gridArea"></div>

                <!-- 1열 가로 전체 카드 영역 (확인 불가 항목 및 5번째 카드 배치용) -->
                <div class="full-width-area" id="fullWidthArea"></div>

                <div class="ai-guide-text">
                    ✨ 업로드한 서류를 바탕으로 궁금한 내용을 쉽게 설명해드려요.
                </div>

                <!-- 하단 버튼 영역 -->
                <div class="result-actions">
                    <a href="chat.html" class="btn-ask-ai">
                        💬 전셈에게 더 물어보기
                    </a>
                    <a href="analyze.html" class="btn-retest">
                        다시 진단하기
                    </a>
                    <a href="../index.html" class="btn-home-link">← 홈으로</a>
                </div>

            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadType = sessionStorage.getItem('uploadType') || 'both';

            const resultHero = document.getElementById('resultHero');
            const gridArea = document.getElementById('gridArea');
            const fullWidthArea = document.getElementById('fullWidthArea');

            // ----------------------------------------------------
            // 1. 등기부등본 + 계약서 둘 다 업로드했을 때 (both)
            // ----------------------------------------------------
            if (uploadType === 'both') {
                resultHero.innerHTML = `
                    <img src="../images/safe.png" alt="전셈이 안전" class="result-hero-img">
                    <h2 class="result-title">현재 확인한 항목에서는 큰 위험요소가 없어요</h2>
                    <div class="risk-badge-wrap">
                        종합 위험도: <span class="badge-safe">안전</span>
                    </div>
                    <p class="result-desc">
                        확인한 등기부등본에서 큰 위험요소가 발견되지 않았어요. 그래도 계약 전 원본 서류를 직접 다시 확인해주세요.
                    </p>
                `;

                gridArea.innerHTML = `
                    <!-- 1. 근저당권 설정 여부 -->
                    <div class="result-card" style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                🏦 근저당권 설정 여부
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#E8F5E9; color:#2E7D32;">
                                안전
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            설정된 근저당권이 없어요.
                        </p>
                    </div>

                    <!-- 2. 압류·가압류 여부 -->
                    <div class="result-card" style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                ⚠️ 압류·가압류 여부
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#E8F5E9; color:#2E7D32;">
                                안전
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            압류·가압류 이력이 없어요.
                        </p>
                    </div>

                    <!-- 3. 소유자·임대인 일치 여부 -->
                    <div class="result-card" style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                👤 소유자·임대인 일치 여부
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#E8F5E9; color:#2E7D32;">
                                안전
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            등기부등본상 소유자와 계약서상 임대인이 일치해요.
                        </p>
                    </div>

                    <!-- 4. 전입신고·확정일자 특약 -->
                    <div class="result-card" style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                📝 전입신고·확정일자 특약
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#E8F5E9; color:#2E7D32;">
                                안전
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            계약 당일 전입신고·확정일자를 완료하는 특약이 포함돼 있어요.
                        </p>
                    </div>
                `;

                // 5번째 카드는 가로 전체(좌측 정렬) 배치
                fullWidthArea.innerHTML = `
                    <div style="max-width:342px; background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                📄 권리관계 변동 시 해제 조항
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#E8F5E9; color:#2E7D32;">
                                안전
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            잔금 전 근저당 등 변동 시 계약 해제 조항이 있어요.
                        </p>
                    </div>
                `;

                // ----------------------------------------------------
                // 2. 계약서만 업로드했을 때 (contract_only)
                // ----------------------------------------------------
            } else if (uploadType === 'contract_only') {
                resultHero.innerHTML = `
                    <img src="../images/danger.png" alt="전셈이 위험 경고" class="result-hero-img">
                    <h2 class="result-title">이 집은 한 번 더 확인해보세요.</h2>
                    <div class="risk-badge-wrap">
                        종합 위험도: <span class="badge-warning">주의</span>
                    </div>
                    <p class="result-desc">
                        일부 항목에서 확인이 필요한 내용이 발견됐어요. 계약 전에 위험요소를 꼼꼼히 확인해보세요.
                    </p>
                `;

                gridArea.innerHTML = `
                    <div class="result-card" style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                📝 전입신고·확정일자 특약
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#FFEBEE; color:#C62828;">
                                확인 필요
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            전입신고·확정일자 관련 특약이 보이지 않아요. 추가를 요청하세요.
                        </p>
                    </div>

                    <div class="result-card" style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                📄 권리관계 변동 시 해제 조항
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#FFEBEE; color:#C62828;">
                                확인 필요
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            권리관계 변동 시 계약 해제 조항이 빠져 있어요. 특약에 추가하는 걸 권해요.
                        </p>
                    </div>
                `;

                // 계약서만 올렸을 때: "등기부등본을 계약서와 함께 업로드하면..."
                fullWidthArea.innerHTML = `
                    <div style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:22px 24px; display:flex; flex-direction:column; gap:12px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span style="font-size:20px; color:#4B5566;">👤</span>
                                <span style="font-size:17px; font-weight:800; color:#1C263A;">소유자·임대인 일치 여부</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:6px; background:#F4F6FA; padding:6px 14px; border-radius:999px;">
                                <span style="font-size:13.5px; font-weight:700; color:#7C879A;">확인 불가</span>
                            </div>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            등기부등본을 계약서와 함께 업로드하면 소유자와 임대인이 같은지 확인할 수 있어요.
                        </p>
                    </div>
                `;

                // ----------------------------------------------------
                // 3. 등기부등본만 업로드했을 때 (registry_only)
                // ----------------------------------------------------
            } else if (uploadType === 'registry_only') {
                resultHero.innerHTML = `
                    <img src="../images/danger.png" alt="전셈이 위험 경고" class="result-hero-img">
                    <h2 class="result-title">이 집은 한 번 더 확인해보세요.</h2>
                    <div class="risk-badge-wrap">
                        종합 위험도: <span class="badge-warning">주의</span>
                    </div>
                    <p class="result-desc">
                        일부 항목에서 확인이 필요한 내용이 발견됐어요. 계약 전에 위험요소를 꼼꼼히 확인해보세요.
                    </p>
                `;

                gridArea.innerHTML = `
                    <div class="result-card" style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                🏦 근저당권 설정 여부
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#FFEBEE; color:#C62828;">
                                확인 필요
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            근저당권이 설정되어 있어요. 채권최고액과 보증금 합을 시세와 비교해보세요.
                        </p>
                    </div>

                    <div class="result-card" style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:150px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;">
                            <span style="font-size:17px; font-weight:800; color:#1C263A; display:flex; align-items:center; gap:6px;">
                                ⚠️ 압류·가압류 여부
                            </span>
                            <span style="font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; background:#FFEBEE; color:#C62828;">
                                확인 필요
                            </span>
                        </div>
                        <p style="font-size:14px; color:#7C879A; margin:0; line-height:1.5; word-break:keep-all;">
                            압류 또는 가압류 이력이 확인돼요. 권리관계를 꼭 다시 확인하세요.
                        </p>
                    </div>
                `;

                // 등기부등본만 올렸을 때: "계약서를 등기부등본과 함께 업로드하면..."
                fullWidthArea.innerHTML = `
                    <div style="background:#fff; border:1px solid #F1F3F7; border-radius:20px; padding:22px 24px; display:flex; flex-direction:column; gap:12px; box-shadow:0 8px 24px rgba(19,27,46,0.06);">
                        <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
                            <div style="display:flex; align-items:center; gap:10px;">
