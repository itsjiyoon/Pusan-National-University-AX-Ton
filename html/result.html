<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전셈 | 진단 결과</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .result-sec {
            padding: 40px 24px 80px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 2단 분할 레이아웃 컨테이너 */
        .split-layout-wrap {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 32px;
            width: 100%;
            max-width: 720px;
            transition: max-width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .split-layout-wrap.expanded {
            max-width: 1240px;
        }

        .result-container {
            width: 100%;
            max-width: 720px;
            flex-shrink: 0;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .split-layout-wrap.expanded .result-container {
            max-width: 580px;
        }

        /* 우측 쉬운 말 설명 패널 */
        .explanation-side-panel {
            flex: 1;
            min-width: 0;
            max-width: 0;
            opacity: 0;
            visibility: hidden;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-sizing: border-box;
        }

        .split-layout-wrap.expanded .explanation-side-panel {
            max-width: 600px;
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .result-header {
            margin-bottom: 24px;
        }

        .result-header .brand {
            font-size: 18px;
            font-weight: 800;
            color: var(--blue, #243B64);
            margin-bottom: 4px;
        }

        .result-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--ink, #1C263A);
            margin: 0;
        }

        /* 메인 결과 비주얼 & 타이틀 */
        .result-hero {
            text-align: center;
            margin-bottom: 36px;
        }

        .result-hero-img {
            width: 140px;
            height: auto;
            margin: 0 auto 16px;
            display: block;
        }

        .result-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--ink, #1C263A);
            margin-bottom: 12px;
        }

        .risk-badge-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-700, #4B5566);
            margin-bottom: 14px;
        }

        /* 뱃지 스타일 */
        .badge-warning {
            background: #FFF3E0;
            color: #E65100;
            font-weight: 800;
            font-size: 13.5px;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .badge-safe {
            background: #E8F5E9;
            color: #2E7D32;
            font-weight: 800;
            font-size: 13.5px;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .result-desc {
            font-size: 15px;
            color: var(--gray-500, #7C879A);
            line-height: 1.55;
            margin: 0;
            word-break: keep-all;
        }

        /* 2열 진단 결과 카드 그리드 */
        .result-grid {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 16px !important;
            margin-bottom: 16px !important;
        }

        /* 확인 불가 전용 1열 카드를 위한 공간 */
        .full-width-area {
            margin-bottom: 24px;
        }

        /* 안내 텍스트 및 우측 토글 버튼 구역 */
        .ai-guide-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            background: #F8FAFC;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid #EEF2F6;
        }

        .ai-guide-text {
            font-size: 14px;
            font-weight: 600;
            color: #64748B;
            margin: 0;
        }

        /* 빨간 박스 위치의 '쉬운 말로 보기' 액션 버튼 */
        .btn-toggle-explain {
            background: #FFFFFF;
            border: 1.5px solid #243B64;
            color: #243B64;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(36, 59, 100, 0.08);
            transition: all 0.2s ease;
        }

        .btn-toggle-explain:hover {
            background: #243B64;
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .btn-toggle-explain.active {
            background: #243B64;
            color: #FFFFFF;
        }

        /* 하단 버튼 영역 */
        .result-actions {
            border-top: 1px solid var(--gray-300, #D7DEE8);
            padding-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-ask-ai {
            width: 100%;
            background: var(--navy, #243B64);
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            padding: 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(36, 59, 100, 0.18);
            transition: background 0.15s, transform 0.15s;
            box-sizing: border-box;
        }

        .btn-ask-ai:hover {
            background: var(--blue-900, #16233D);
            transform: translateY(-2px);
        }

        .btn-retest {
            width: 100%;
            background: #FFFFFF;
            color: var(--navy, #243B64);
            border: 1.5px solid var(--gray-300, #D7DEE8);
            font-size: 17px;
            font-weight: 800;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: border-color 0.15s, transform 0.15s;
            box-sizing: border-box;
        }

        .btn-retest:hover {
            border-color: var(--navy, #243B64);
            transform: translateY(-2px);
        }

        .btn-home-link {
            display: block;
            text-align: center;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--gray-500, #7C879A);
            text-decoration: underline;
            margin-top: 12px;
        }

        .btn-home-link:hover {
            color: var(--blue, #243B64);
        }

        /* ========================================================
           우측 패널 (diagnosis_tooltip 디자인 & 용어사전 팝업)
           ======================================================== */
        .explain-box {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
        }

        .explain-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .explain-head h2 {
            font-size: 22px;
            font-weight: 800;
            color: #1C263A;
            margin: 0 0 6px 0;
            letter-spacing: -0.4px;
        }

        .explain-head p {
            font-size: 13.5px;
            color: #64748B;
            margin: 0;
            font-weight: 500;
        }

        .btn-close-explain {
            background: #F1F5F9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            color: #64748B;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .btn-close-explain:hover {
            background: #E2E8F0;
            color: #1E293B;
        }

        .tooltip-card {
            background: #FFFFFF;
            border: 1px solid #ECEEF2;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(20, 24, 40, 0.03);
        }

        .tooltip-card:last-child {
            margin-bottom: 0;
        }

        .tooltip-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .tooltip-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 800;
            color: #1C263A;
        }

        .tooltip-badge-red {
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            background: #FDE9E6;
            color: #E0503C;
        }

        .tooltip-badge-green {
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            background: #E8F5E9;
            color: #2E7D32;
        }

        .tooltip-badge-gray {
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            background: #F1F5F9;
            color: #64748B;
        }

        .tooltip-plain {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: #F8FAFC;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #F1F5F9;
        }

        .tooltip-plain .emoji {
            font-size: 18px;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .tooltip-plain p {
            margin: 0;
            font-size: 14px;
            line-height: 1.65;
            color: #1E293B;
            word-break: keep-all;
        }

        .tooltip-whybox {
            font-size: 13.5px;
            color: #475569;
            line-height: 1.55;
            margin: 0;
            padding-left: 4px;
            word-break: keep-all;
        }

        /* 단어 툴팁 팝업 스타일 */
        .term {
            position: relative;
            display: inline;
            cursor: help;
            font-weight: 800;
            color: #1E3A8A;
            border-bottom: 1.5px dashed #93C5FD;
            padding-bottom: 1px;
        }

        .term .popup {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            transform: translateX(-50%) translateY(4px);
            width: 250px;
            background: #1E2A4A;
            color: #FFFFFF;
            font-weight: 400;
            font-size: 13px;
            line-height: 1.55;
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 10px 25px rgba(20, 24, 40, 0.25);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 50;
            text-align: left;
            pointer-events: none;
            word-break: keep-all;
        }

        .term .popup .arrow {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #1E2A4A;
            rotate: 45deg;
            margin-top: -5px;
        }

        .term:hover .popup {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .tooltip-card-title .term .popup {
            bottom: auto;
            top: calc(100% + 10px);
            transform: translateX(-50%) translateY(-4px);
        }

        .tooltip-card-title .term:hover .popup {
            transform: translateX(-50%) translateY(0);
        }

        .tooltip-card-title .term .popup .arrow {
            top: auto;
            bottom: 100%;
            margin-top: 0;
            margin-bottom: -5px;
        }

        @media (max-width: 992px) {
            .split-layout-wrap.expanded {
                flex-direction: column;
                align-items: center;
            }

            .split-layout-wrap.expanded .result-container {
                max-width: 100%;
            }

            .split-layout-wrap.expanded .explanation-side-panel {
                max-width: 100%;
                width: 100%;
            }
        }

        @media (max-width: 620px) {
            .result-grid {
                grid-template-columns: 1fr !important;
            }

            .result-title {
                font-size: 22px;
            }

            .ai-guide-row {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .btn-toggle-explain {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="wrap nav">
            <a href="../index.html" class="logo">
                <img src="../images/logo.png" width="40" alt="전셈 로고">
                전셈
            </a>
            <nav class="nav-menu">
                <a href="../index.html#services">서비스 소개</a>
                <a href="../index.html#diagnosis-section">안전진단</a>
                <a href="chat.html">AI 챗봇</a>
                <a href="../index.html#footer">고객지원</a>
            </nav>
        </div>
    </header>

    <!-- MAIN RESULT SECTION -->
    <section class="result-sec">
        <div class="split-layout-wrap" id="splitLayoutWrap">

            <!-- 좌측: 진단 결과 컨테이너 -->
            <div class="result-container">

                <!-- 상단 제목 -->
                <div class="result-header">
                    <div class="brand"></div>
                    <h1>진단 결과</h1>
                </div>

                <!-- 메인 결과 비주얼 및 서머리 -->
                <div class="result-hero" id="resultHero">
                    <!-- 스크립트에서 동적 생성 -->
                </div>

                <!-- 2열 진단 카드 영역 -->
                <div class="result-grid" id="gridArea"></div>

                <!-- 1열 가로 전체 카드 영역 (확인 불가 항목 및 5번째 카드 배치용) -->
                <div class="full-width-area" id="fullWidthArea"></div>

                <!-- 안내 텍스트 & 쉬운 말로 보기 버튼 (빨간 박스 영역) -->
                <div class="ai-guide-row">
                    <div class="ai-guide-text">
                        ✨ 업로드한 서류를 바탕으로 궁금한 내용을 쉽게 설명해드려요.
                    </div>
                    <button type="button" class="btn-toggle-explain" id="btnToggleExplain"
                        onclick="toggleExplanationPanel()">
                        🔍 쉬운 말로 보기
                    </button>
                </div>

                <!-- 하단 버튼 영역 -->
                <div class="result-actions">
                    <a href="chat.html" class="btn-ask-ai">
                        💬 전셈에게 더 물어보기
                    </a>
                    <a href="analyze.html" class="btn-retest">
                        다시 진단하기
                    </a>
                    <a href="../index.html" class="btn-home-link">← 홈으로</a>
                </div>

            </div>

            <!-- 우측: 쉬운 말 설명 패널 (diagnosis_tooltip 연동) -->
            <div class="explanation-side-panel" id="explanationSidePanel">
                <div class="explain-box">
                    <div class="explain-head">
                        <div>
                            <h2>쉬운 말로 알려드릴게요</h2>
                            <p>✨ 어려운 법률·부동산 용어는 빼고, 서류의 핵심만 쉽게 설명해요</p>
                        </div>
                        <button type="button" class="btn-close-explain" onclick="toggleExplanationPanel()"
                            title="패널 닫기">✕</button>
                    </div>

                    <!-- 업로드 상태에 따라 동적 생성되는 툴팁 카드 리스트 -->
                    <div id="explanationCardsContainer"></div>
                </div>
            </div>

        </div>
    </section>

    <script>
        /* 전세계약 용어사전 데이터베이스 */
        const GLOSSARY = {
            "근저당권": "금융기관이 집을 담보로 설정하는 대출 기록이에요. 집주인이 돈을 갚지 못하면 집이 경매로 넘어가 매각 대금을 은행이 먼저 가져갈 수 있어요.",
            "가압류": "채권자가 채무자의 재산을 임시로 처분하지 못하도록 법으로 묶어두는 조치예요. 소송 후 정식 압류로 전환되어 경매가 진행될 수 있어요.",
            "압류": "세금 체납이나 채무 불이행으로 국가나 채권자가 재산권 행사를 정지시키는 조치예요. 언제든 경매로 넘어갈 수 있는 매우 위험한 상태예요.",
            "가등기": "소유자의 지위를 다른 사람이 미리 예약해두는 상태예요. 가등기권자가 본등기로 전환하면 세입자의 계약이 즉시 무효가 될 수 있어요.",
            "경매": "채무를 변제하기 위해 법원이 부동산을 강제 매각하는 절차예요. 선순위 채권이 많으면 보증금을 온전히 돌려받지 못할 수 있어요.",
            "깡통전세": "근저당권(대출금)과 전세보증금의 합계가 집 시세의 60~80%를 넘어서는 집이에요. 집값 하락 시 보증금 미반환 위험이 큽니다.",
            "대항력": "전입신고와 실제 거주(점유)를 마치면 다음 날 0시부터 발생하는 권리로, 집주인이 바뀌어도 계속 거주하고 보증금을 요구할 수 있는 법적 지위예요.",
            "우선변제권": "대항력과 확정일자를 갖춘 세입자가 집이 경매로 넘어갔을 때 후순위 채권자보다 먼저 보증금을 돌려받을 수 있는 권리예요.",
            "선순위 채권": "내 확정일자보다 앞서 설정된 근저당권이나 전세권 등을 말해요. 경매 시 선순위 권리자가 돈을 먼저 배당받습니다.",
            "소유권": "등기부등본 갑구에 기재되는 권리로, 집의 진짜 주인임을 증명하는 권리예요. 계약자 신분증과 반드시 일치해야 해요.",
            "임대인": "집을 빌려주는 사람(집주인)이에요. 등기부등본 갑구의 실제 소유자와 계약자가 일치하는지 확인해야 해요.",
            "임차인": "돈을 내고 집을 빌려 쓰는 사람(세입자 본인)이에요. 보증금 보호를 위해 전입신고와 확정일자를 당일 처리해야 해요.",
            "전입신고": "새 주소로 이사한 사실을 관공서에 신고하는 절차로, 신고 '다음 날 0시'부터 대항력이 발생해요.",
            "확정일자": "계약서가 특정 날짜에 존재했음을 공적으로 증명하는 도장으로, 우선변제권의 순위를 결정하는 핵심 요소예요.",
            "특약사항": "표준 계약서 외에 보증금 보호를 위해 당사자 간에 특별히 추가하는 합의 조항(예: 대항력 확보 전 담보권 설정 금지)이에요.",
