<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- 화사하고 부드러운 스카이블루/민트 그라데이션 베이스 -->
    <linearGradient id="cute-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F9FD"/>
      <stop offset="100%" stop-color="#E8F3FD"/>
    </linearGradient>

    <!-- 우측 상단 몽실몽실 옐로우/오렌지 방울 -->
    <linearGradient id="cute-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>

    <!-- 좌측 하단 퐁당퐁당 블루 방울 -->
    <linearGradient id="cute-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70B4FD"/>
      <stop offset="100%" stop-color="#3B76EB"/>
    </linearGradient>

    <!-- 빌딩용 부드러운 파스텔 블렌드 -->
    <linearGradient id="cute-house-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1EEFB"/>
      <stop offset="100%" stop-color="#C8E1F8"/>
    </linearGradient>
    <linearGradient id="cute-house-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2E7FC"/>
      <stop offset="100%" stop-color="#B8D9F9"/>
    </linearGradient>

    <!-- 반짝이 별 필터/스타일 -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 전체 배경 -->
  <rect width="1440" height="650" fill="url(#cute-bg)"/>

  <!-- ================= 1. 둥글둥글 몽실한 원경 구름 ================= -->
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M280 280 Q320 230 370 250 Q420 220 470 260 Q520 240 550 280 Z"/>
    <path d="M880 180 Q930 140 980 160 Q1030 130 1080 170 Q1120 150 1150 190 Z"/>
    <path d="M1180 320 Q1220 280 1270 300 Q1310 270 1350 310 Q1380 290 1410 330 Z"/>
  </g>

  <!-- ================= 2. 둥글둥글 귀여운 장난감 마을 빌딩 ================= -->
  <!-- 뒤쪽 연한 빌딩들 -->
  <g fill="url(#cute-house-1)" opacity="0.8">
    <rect x="420" y="320" width="55" height="280" rx="20"/>
    <!-- 삼각 지붕 집 -->
    <path d="M510 340 L545 295 L580 340 Z"/>
    <rect x="515" y="335" width="60" height="265" rx="16"/>
    
    <rect x="680" y="300" width="65" height="300" rx="22"/>
    <rect x="860" y="270" width="60" height="330" rx="20"/>
    <rect x="1050" y="290" width="70" height="310" rx="24"/>
    <rect x="1220" y="320" width="60" height="280" rx="20"/>
  </g>

  <!-- 앞쪽 또렷하고 귀여운 빌딩들 + 동글 창문 -->
  <g fill="url(#cute-house-2)">
    <!-- 빌딩 1 -->
    <rect x="600" y="240" width="68" height="360" rx="24"/>
    <circle cx="623" cy="275" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="645" cy="275" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="623" cy="305" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="645" cy="305" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="634" cy="340" r="6" fill="#FFE58F"/>

    <!-- 삼각 꼬깔집 2 -->
    <path d="M760 260 L800 210 L840 260 Z"/>
    <rect x="765" y="255" width="70" height="345" rx="20"/>
    <circle cx="800" cy="245" r="7" fill="#FFFFFF"/>
    <rect x="782" y="285" width="14" height="18" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <rect x="804" y="285" width="14" height="18" rx="6" fill="#FFFFFF" opacity="0.95"/>

    <!-- 빌딩 3 -->
    <rect x="940" y="210" width="75" height="390" rx="26"/>
    <rect x="960" y="245" width="15" height="15" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <rect x="982" y="245" width="15" height="15" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <rect x="960" y="275" width="15" height="15" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <rect x="982" y="275" width="15" height="15" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="978" cy="315" r="5" fill="#FFE58F"/>

    <!-- 빌딩 4 -->
    <rect x="1135" y="250" width="65" height="350" rx="22"/>
    <circle cx="1155" cy="285" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="1178" cy="285" r="5" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- ================= 3. 통통 튀는 안심 하트 & 반짝이 별 & 비눗방울 ================= -->
  <!-- 빵빵한 핑크/블루 하트 -->
  <path d="M460 180 C460 168 472 162 482 172 C492 162 504 168 504 180 C504 195 482 210 482 210 C482 210 460 195 460 180 Z" fill="#FFA39E" opacity="0.85"/>
  <path d="M1090 140 C1090 128 1102 122 1112 132 C1122 122 1134 128 1134 140 C1134 155 1112 170 1112 170 C1112 170 1090 155 1090 140 Z" fill="#85A5FF" opacity="0.8"/>

  <!-- 노란 반짝이 4포인트 스타 (Sparkles) -->
  <g fill="#FFD666" filter="url(#soft-glow)">
    <!-- 별 1 -->
    <path d="M560 130 Q560 145 545 145 Q560 145 560 160 Q560 145 575 145 Q560 145 560 130 Z"/>
    <!-- 별 2 -->
    <path d="M910 100 Q910 118 892 118 Q910 118 910 136 Q910 118 928 118 Q910 118 910 100 Z"/>
    <!-- 작은 별 3 -->
    <path d="M1250 190 Q1250 200 1240 200 Q1250 200 1250 210 Q1250 200 1260 200 Q1250 200 1250 190 Z"/>
  </g>

  <!-- 퐁당퐁당 비눗방울 물방울 -->
  <circle cx="525" cy="120" r="8" fill="#BAE7FF" opacity="0.6"/>
  <circle cx="538" cy="110" r="4" fill="#BAE7FF" opacity="0.8"/>
  <circle cx="865" cy="150" r="10" fill="#BAE7FF" opacity="0.5"/>
  <circle cx="1180" cy="140" r="7" fill="#D3F261" opacity="0.7"/>

  <!-- ================= 4. 동글동글한 코너 물방울 장식 ================= -->
  <!-- 우측 상단 오렌지 젤리 물방울 -->
  <path d="M1220 0 C1250 70 1320 120 1440 125 V0 Z" fill="url(#cute-yellow)"/>
  <circle cx="1225" cy="50" r="14" fill="#FFE58F" opacity="0.5"/>

  <!-- 좌측 하단 푸른 젤리 물방울 -->
  <path d="M0 500 C110 500 170 560 200 650 H0 Z" fill="url(#cute-blue)"/>
  <circle cx="180" cy="530" r="16" fill="#91CAFF" opacity="0.4"/>

  <!-- 우측 하단 동글 라인 아치 -->
  <path d="M1220 650 C1280 570 1360 540 1440 535" fill="none" stroke="#70B4FD" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
  <circle cx="1310" cy="565" r="5" fill="#70B4FD" opacity="0.6"/>
</svg>
